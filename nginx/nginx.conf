user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # --------------------------------------------------------------------------
    # Core Performance Settings
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    
    # Security: Hide Nginx version
    server_tokens off;

    # --------------------------------------------------------------------------
    # Compression (Gzip)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # --------------------------------------------------------------------------
    # Upstream Definitions
    # --------------------------------------------------------------------------
    upstream django_server {
        # 'web' is the container name of the Daphne ASGI backend
        server web:8000;
    }

    upstream frontend_server {
        # 'frontend' is the container name of the React app (nginx serving dist)
        server frontend:80;
    }

    # --------------------------------------------------------------------------
    # HTTP -> HTTPS Redirect & ACME Challenge
    # --------------------------------------------------------------------------
    # Frontend Domain
    server {
        listen 80;
        server_name studio.nextoracreations.co.in;

        # Allow Certbot to validate the domain via webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect normal HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API Domain
    server {
        listen 80;
        server_name api.studio.nextoracreations.co.in;

        # Allow Certbot to validate the domain via webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect normal HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

